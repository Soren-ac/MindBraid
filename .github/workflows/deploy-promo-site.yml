name: Deploy MindBraid promo site

on:
  push:
    branches: [main]
    paths:
      - "promo-site/**"
      - "assets/readme/**"
      - "tests/visual/__screenshots__/mindbraid.visual.spec.ts/chromium-macos/presentation-speaker-spotlight.png"
      - ".github/workflows/deploy-promo-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          rm -rf dist
          mkdir -p dist/assets/readme dist/assets/presentation
          cp promo-site/index.html promo-site/style.css dist/
          cp assets/readme/obmind-logo.svg assets/readme/showcase-pencil-map.png assets/readme/markdown-to-map.png assets/readme/showcase-appearance-panel.png dist/assets/readme/
          cp tests/visual/__screenshots__/mindbraid.visual.spec.ts/chromium-macos/presentation-speaker-spotlight.png dist/assets/presentation/
          touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
